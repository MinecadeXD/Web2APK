# ============================================================
#                 WEBSITE → APK CONFIGURATION
# ============================================================
#
# Configure the values below and run the GitHub Actions build.
# Detailed explanations, requirements, and examples for every
# option are available in the README.
#
# ============================================================


# Name displayed in the Android app drawer.
# Use normal text. Example: "Website"
app_name: "Website"


# HTTPS website URL that opens when the app starts.
# Use a complete HTTPS URL. Example: "https://example.com/"
website_url: "https://example.com/"


# Version number of the generated Android application.
# Use a three-part version such as 1.0.0, 1.2.3, or 2.0.0.
version: "1.0.0"


# Final part of the generated Android package name.
# The complete package name is: com.minecade.<package_suffix>
package_suffix: "website"


# Launcher icon for the generated Android application.
# Use a PNG, JPG, or JPEG image from this repository.
icon: "config/icon.png"


# Background color displayed behind the splash screen icon.
# Use "white", "black", or a 6-digit hex color such as "#121212".
splash_background: white


# Toolbar color used by the website's Android Custom Tab.
# Use "white", "black", or a 6-digit hex color such as "#121212".
toolbar_color: "#121212"


# Controls whether the website title is displayed in the toolbar.
# Set to true to show the title or false to hide it.
show_title: true


# Controls whether the Custom Tab URL bar can hide while scrolling.
# Set to true to allow hiding or false to keep it visible.
url_bar_hiding: true
